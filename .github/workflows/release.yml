name: Release artifacts
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    defaults:
      run:
        working-directory: firmware/esp32
    steps:
      - uses: actions/checkout@v4
      - run: python test/check_web_ui.py
      - run: python test/check_reliability.py
      - run: . /opt/esp/idf/export.sh && idf.py build
      - run: python tools/release_manifest.py --version $GITHUB_REF_NAME --git-sha $GITHUB_SHA --output build/release
      - uses: softprops/action-gh-release@v2
        with:
          files: firmware/esp32/build/release/*
